<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Premium | ERP & Manufacturing</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script> <!-- Storage SDK added -->

    <style>
        /* ... (Existing CSS remains same) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; display: none; }
        .login-container { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; position: relative; }
        .logout-btn { position: absolute; right: 0; top: 10px; background: #ef4444; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold;}
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: #1e293b; color: #94a3b8; padding: 10px 20px; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #0ea5e9; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        .btn { background: #0ea5e9; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .status-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .status-table th, .status-table td { padding: 12px; border: 1px solid #334155; text-align: left; }
    </style>
</head>
<body>

    <div class="login-container" id="login-box">
        <h2>🏭 Prince Factory Login</h2>
        <div class="form-group"><input type="email" id="login-email" placeholder="Admin Email"></div>
        <div class="form-group"><input type="password" id="login-pass" placeholder="Password"></div>
        <button class="btn" onclick="loginAdmin()">Sign In</button>
    </div>

    <div class="container" id="main-system">
        <header>
            <h1>🏭 Prince Premium Manufacturing</h1>
            <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('raw-material')">📦 Raw Material</button>
            <button class="tab-btn" onclick="switchTab('receipts')">🧾 Bills/Receipts</button>
        </div>

        <!-- TAB: RAW MATERIAL -->
        <div id="raw-material" class="tab-content active">
            <!-- (Same as before) -->
            <div class="card">
                <h3>➕ Add Material</h3>
                <input type="text" id="raw-name" placeholder="Material Name" style="margin-bottom:10px; width:100%; padding:10px;">
                <button class="btn" onclick="saveRawMaterial()">Add</button>
            </div>
        </div>

        <!-- TAB: RECEIPT UPLOAD (New) -->
        <div id="receipts" class="tab-content">
            <div class="card">
                <h3>🧾 Upload Purchase Bill / Receipt</h3>
                <div class="form-group">
                    <label>Bill Description:</label>
                    <input type="text" id="bill-desc" placeholder="e.g. Fabric Bill - Oct 2025">
                </div>
                <div class="form-group">
                    <input type="file" id="bill-file" accept="image/*">
                </div>
                <button class="btn" onclick="uploadReceipt()">Upload & Save Receipt</button>
                <div id="upload-status" style="margin-top:10px; color:#38bdf8;"></div>
            </div>
            <div class="card" style="margin-top:20px;">
                <h3>📜 Uploaded Bills</h3>
                <table class="status-table" id="receipt-table">
                    <thead><tr><th>Description</th><th>View Bill</th></tr></thead>
                    <tbody id="receipt-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnAObkRA9eYPwpk44Q6YS5NY18lZUdAeM",
      authDomain: "prince-primium.firebaseapp.com",
      databaseURL: "https://prince-primium-default-rtdb.firebaseio.com",
      projectId: "prince-primium",
      storageBucket: "prince-primium.appspot.com", // Ensure this matches your Firebase settings
      messagingSenderId: "182442384742",
      appId: "1:182442384742:web:3dce7d5090e5d2d4e33ca7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    function loginAdmin() {
        const email = document.getElementById("login-email").value;
        const pass = document.getElementById("login-pass").value;
        if (email === "prince@gmail.com" && pass === "prince786") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("main-system").style.display = "block";
            loadReceipts();
        } else { alert("Login Failed!"); }
    }

    function logoutAdmin() {
        // SECURE LOGOUT: Clear memory and hide UI instantly
        document.getElementById("main-system").style.display = "none";
        document.getElementById("login-box").style.display = "block";
        window.location.reload(); // Hard refresh to clear session
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    // Receipt Upload Logic
    function uploadReceipt() {
        const file = document.getElementById('bill-file').files[0];
        const desc = document.getElementById('bill-desc').value;
        if(!file || !desc) return alert("Select file and write description!");

        const storageRef = storage.ref('bills/' + Date.now() + '_' + file.name);
        document.getElementById('upload-status').innerText = "Uploading...";
        
        storageRef.put(file).then(snapshot => {
            snapshot.ref.getDownloadURL().then(url => {
                db.ref('factory_erp/bills').push({ desc, url, timestamp: Date.now() });
                document.getElementById('upload-status').innerText = "✅ Uploaded!";
                document.getElementById('bill-desc').value = "";
            });
        });
    }

    function loadReceipts() {
        db.ref('factory_erp/bills').on('value', snapshot => {
            const tbody = document.getElementById("receipt-rows");
            tbody.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                Object.values(data).reverse().forEach(d => {
                    tbody.innerHTML += `<tr><td>${d.desc}</td><td><a href="${d.url}" target="_blank">View Bill</a></td></tr>`;
                });
            }
        });
    }
    </script>
</body>
</html>
