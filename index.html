<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Premium | ERP & Manufacturing Management</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; display: none; }
        
        .login-container { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .login-container h2 { margin-bottom: 20px; color: #38bdf8; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; position: relative; }
        h1 { color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .logout-btn { position: absolute; right: 0; top: 10px; background: #ef4444; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold;}
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: #1e293b; color: #94a3b8; padding: 10px 20px; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 992px) { .grid { grid-template-columns: 1fr; } }
        
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; height: fit-content; }
        .card h3 { margin-bottom: 20px; color: #f1f5f9; border-bottom: 1px dashed #475569; padding-bottom: 8px; font-size: 18px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
        
        .btn { background: #0ea5e9; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; font-size: 14px; letter-spacing: 0.5px; }
        .btn:hover { background: #0284c7; }
        
        .status-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e293b; }
        .status-table th, .status-table td { padding: 12px; border: 1px solid #334155; text-align: left; font-size: 14px; }
        .status-table th { background: #0f172a; color: #38bdf8; font-weight: 600; }
        .status-table tr:hover { background: #24334d; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-raw { background: #6366f1; color: white; }
        
        /* Debug Console Style */
        #debug-panel { margin-top: 40px; padding: 15px; background: #000; border: 2px solid #ef4444; border-radius: 8px; color: #10b981; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="login-container" id="login-box">
        <h2>🏭 Prince Factory ERP</h2>
        <div class="form-group">
            <input type="email" id="login-email" placeholder="Admin Email ID">
        </div>
        <div class="form-group">
            <input type="password" id="login-pass" placeholder="Password">
        </div>
        <button class="btn" onclick="loginAdmin()">Sign In</button>
    </div>

    <!-- 2. MAIN CONTENT -->
    <div class="container" id="main-system">
        <header>
            <h1>🏭 Prince Premium Manufacturing</h1>
            <p style="color: #94a3b8; margin-top: 5px;">System Diagnostic Edition</p>
            <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('raw-material', this)">📦 Raw Material (कच्चा माल)</button>
        </div>

        <!-- TAB 1: RAW MATERIAL -->
        <div id="raw-material" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <h3>➕ Inward Raw Material</h3>
                    <div class="form-group">
                        <label>Material Name:</label>
                        <input type="text" id="raw-name" placeholder="e.g. Fabric">
                    </div>
                    <div class="form-group">
                        <label>Quantity:</label>
                        <input type="number" id="raw-qty" placeholder="100">
                    </div>
                    <div class="form-group">
                        <label>Supplier Name:</label>
                        <input type="text" id="raw-vendor" placeholder="e.g. Vendor A">
                    </div>
                    <button class="btn" onclick="saveRawMaterial()">Add Material</button>
                </div>
                <div class="card">
                    <h3>📊 Current Raw Material Stock</h3>
                    <table class="status-table">
                        <thead>
                            <tr><th>Material</th><th>Qty Available</th><th>Supplier</th></tr>
                        </thead>
                        <tbody id="raw-stock-rows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. LIVE ON-SCREEN DEBUGGER -->
    <div id="debug-panel">
        <h4 style="color: #ef4444; margin-bottom: 5px;">🛠️ System Mobile Debugger Logs:</h4>
        <div id="debug-logs">System initialized. Waiting for action...</div>
    </div>

    <script>
    // Log function to show errors on mobile screen directly
    function logDebug(msg, isError = false) {
        const consoleDiv = document.getElementById("debug-logs");
        const color = isError ? "red" : "#10b981";
        consoleDiv.innerHTML += `<br><span style="color: ${color};">[${new Date().toLocaleTimeString()}] ${msg}</span>`;
    }

    // Catch global JavaScript errors
    window.onerror = function(message, source, lineno, colno, error) {
        logDebug(`JS ERROR: ${message} at line ${lineno}`, true);
        return false;
    };

    const firebaseConfig = {
      apiKey: "AIzaSyCnAObkRA9eYPwpk44Q6YS5NY18lZUdAeM",
      authDomain: "prince-primium.firebaseapp.com",
      databaseURL: "https://prince-primium-default-rtdb.firebaseio.com",
      projectId: "prince-primium",
      storageBucket: "prince-primium.firebasestorage.app",
      messagingSenderId: "182442384742",
      appId: "1:182442384742:web:3dce7d5090e5d2d4e33ca7"
    };

    try {
        firebase.initializeApp(firebaseConfig);
        logDebug("Firebase Initialized Successfully.");
    } catch(e) {
        logDebug("Firebase Init Failed: " + e.message, true);
    }
    
    const db = firebase.database();

    window.onload = function() {
        logDebug("Page loaded. Checking auth token...");
        if (localStorage.getItem("prince_logged_in") === "true") {
            logDebug("Found active session. Bypassing login screen.");
            document.getElementById("login-box").style.display = "none";
            document.getElementById("main-system").style.display = "block";
            loadAllFactoryData();
        } else {
            logDebug("No active session found. Showing login panel.");
        }
    };

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(btn) btn.classList.add('active');
    }

    function loginAdmin() {
        const email = document.getElementById("login-email").value.trim();
        const pass = document.getElementById("login-pass").value;
        if (email === "prince@gmail.com" && pass === "prince786") {
            localStorage.setItem("prince_logged_in", "true");
            logDebug("Login successful. Redirecting to dashboard.");
            document.getElementById("login-box").style.display = "none";
            document.getElementById("main-system").style.display = "block";
            loadAllFactoryData();
        } else {
            alert("Galat Credentials!");
            logDebug("Failed login attempt with: " + email, true);
        }
    }

    function logoutAdmin() {
        localStorage.removeItem("prince_logged_in");
        logDebug("Session cleared. Logging out.");
        window.location.reload(); 
    }

    function saveRawMaterial() {
        const name = document.getElementById("raw-name").value.trim();
        const qty = document.getElementById("raw-qty").value;
        const vendor = document.getElementById("raw-vendor").value.trim();
        
        if(!name || !qty) return alert("Pehle details bharein!");

        logDebug(`Attempting to write to database: ${name}...`);
        db.ref('factory_erp/raw_material').push({
            name: name,
            qty: parseInt(qty),
            vendor: vendor,
            timestamp: Date.now()
        }).then(() => {
            logDebug("Write Successful! Data synced to Firebase.");
            alert("Material Added!");
            document.getElementById("raw-name").value = "";
            document.getElementById("raw-qty").value = "";
            document.getElementById("raw-vendor").value = "";
        }).catch(err => {
            logDebug("Firebase Write Rejected: " + err.message, true);
            alert("Database Error! Check debug log at bottom.");
        });
    }

    function loadAllFactoryData() {
        logDebug("Connecting to Realtime Database stream...");
        db.ref('factory_erp/raw_material').on('value', snapshot => {
            logDebug("Database responded. Parsing stock snapshot.");
            const tbody = document.getElementById("raw-stock-rows");
            tbody.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                let count = 0;
                Object.values(data).reverse().forEach(d => {
                    count++;
                    tbody.innerHTML += `<tr><td><strong>${d.name}</strong></td><td><span class="badge badge-raw">${d.qty} Units</span></td><td>${d.vendor || 'N/A'}</td></tr>`;
                });
                logDebug(`Rendered ${count} material rows successfully.`);
            } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">No Material Stock Available</td></tr>`;
                logDebug("Database node is empty (Null snapshot).");
            }
        }, err => { 
            logDebug("Firebase Read Blocked: " + err.message, true); 
        });
    }
    </script>
</body>
</html>
